[project]
name = "lms-drf"
version = "0.1.0"
description = "Learning Management System"
authors = [
    {name = "Dmitry Shvarev",email = "dima.dreadman@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "django (>=6.1.3,<7.0.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "pillow (>=13.0.0,<14.0.0)",
    "django-filter (>=26.2,<27.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "black (>=26.10.1,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)"
]
